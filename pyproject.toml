[project]
name = "aml-osdd-helper"
version = "0.1.0"
description = "AI-powered Open Source Due Diligence (OSDD) assistant for Anti-Money Laundering investigations."
readme = "README.md"
authors = [
    { name = "Rohit Singh", email = "rsingh.py@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-search-results>=2.4.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "serpapi>=1.1.2",
    "tenacity>=9.1.4",
    "trafilatura>=2.2.0",
]

[project.scripts]
aml-osdd-helper = "src.aml_osdd_helper.main:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
